<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Screen Share</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>Meu Screen Share</h1>

        <div class="room">

            <input
                id="roomInput"
                type="text"
                placeholder="Nome da sala"
                value="teste"
            >

            <button id="joinButton">
                Entrar na sala
            </button>

        </div>

        <div class="controls">

            <label for="resolutionSelect">
                Resolução:
            </label>

            <select id="resolutionSelect">
                <option value="1920x1080">1080p</option>
                <option value="1280x720" selected>720p</option>
                <option value="854x480">480p</option>
            </select>

            <label for="fpsSelect">
                FPS:
            </label>

            <select id="fpsSelect">
                <option value="60" selected>60 FPS</option>
                <option value="30">30 FPS</option>
                <option value="24">24 FPS</option>
            </select>

            <button id="shareButton">
                🖥️ Compartilhar tela
            </button>

            <button id="fullscreenButton">
                ⛶ Tela cheia
            </button>

        </div>

        <div class="videos">

            <div>
                <h2>Minha tela</h2>

                <video
                    id="localVideo"
                    autoplay
                    muted
                    playsinline
                ></video>
            </div>

            <div>
                <h2>Tela recebida</h2>

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline
                ></video>
            </div>

        </div>

        <p id="status">Desconectado</p>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>

</body>
</html>
